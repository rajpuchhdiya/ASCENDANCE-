name: CI Pipeline

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  php-check:
    name: PHP Lint & Composer Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: PHP Syntax Check (Lint)
        run: |
          find . -type f -name "*.php" ! -path "*/vendor/*" ! -path "*/wp-admin/*" ! -path "*/wp-includes/*" -print0 | xargs -0 -n 1 php -l

  theme-build:
    name: Theme Asset Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('wp-content/themes/ascendance/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Theme Dependencies
        working-directory: wp-content/themes/ascendance
        run: npm ci

      - name: Compile Production Theme Assets
        working-directory: wp-content/themes/ascendance
        run: npm run build
